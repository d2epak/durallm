[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "durallm"
version = "0.2.1"
authors = [
  { name="Deepak", email="deepak@users.noreply.github.com" },
]
description = "Durable, self-healing multi-provider LLM gateway and circuit breaker with autonomous failover, tool idempotency, and context compaction for AI agents (Claude Code, Hermes, OpenClaw, OpenCode)."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
asgi = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
]
proxy = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "build>=1.2.2",
    # Benchmark-only: exercises standard router baseline against local custom mock providers.
    "litellm>=1.90.0,<1.91.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["durallm"]

[tool.coverage.report]
# The existing full suite establishes a measured 77% baseline; keep CI above
# the floor while coverage is raised deliberately with transport/stream tests.
fail_under = 72
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# This repository has established long structured literals (fixture payloads,
# URLs, and Markdown report rows). Keep those readable and enforce the
# correctness-oriented rules in CI instead of starting a cosmetic reflow.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
# CI intentionally type-checks the strict circuit-breaker core below.  Its
# dependencies remain runtime-tested, but are outside this incremental typing
# boundary; without this MyPy recursively applies --strict to the whole proxy.
follow_imports = "skip"
files = ["src/durallm/breaker"]
strict = true
warn_unused_configs = true

[project.scripts]
durallm = "durallm.proxy:main"
durallm-discover = "durallm.discovery:main"
llm-proxy = "durallm.proxy:main"
llm-discover = "durallm.discovery:main"

[project.urls]
"Homepage" = "https://github.com/d2epak/durallm"
"Bug Tracker" = "https://github.com/d2epak/durallm/issues"
