# Continuous Integration & Automated Verification Workflow
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Daily automated regression test run at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev,proxy]
        
    - name: Run test suite with coverage
      run: |
        python -m pytest -q --cov=durallm --cov-report=term-missing

    - name: Lint
      run: |
        ruff check .

    - name: Type check circuit-breaker core
      run: |
        mypy

    - name: Build distribution
      run: |
        python -m build
